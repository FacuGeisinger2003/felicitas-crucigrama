name: Crucigrama diario

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar crucigrama del día
        id: gen
        run: node generate.js

      - name: Commitear y pushear el crucigrama nuevo
        run: |
          git config user.name "crucigrama-bot"
          git config user.email "crucigrama-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "Crucigrama del ${{ steps.gen.outputs.date }}"
            git push
          fi
